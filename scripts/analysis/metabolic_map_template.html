<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3種共培養 代謝アトラス</title>
<style>
:root{--ink:#1c303a;--muted:#5d717b;--line:#dbe5e7;--or:#148579;--ns:#426cc0;--pf:#af7136}*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font-family:'Yu Gothic','Meiryo',sans-serif;font-size:14px}header{background:#fff;padding:26px 36px 20px;border-bottom:1px solid var(--line)}.eyebrow{letter-spacing:.17em;color:var(--muted);font-size:11px}h1{margin:8px 0;font-size:27px;font-weight:650}p{line-height:1.8}header p{margin:0;color:var(--muted)}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.badge{font-size:12px;padding:8px 12px;background:#eef3f4;border-radius:20px}.toolbar{display:flex;gap:10px;align-items:center;padding:16px 36px;flex-wrap:wrap}button,select,input{font:inherit;padding:10px 13px;border:1px solid #cbd8dc;border-radius:7px;background:white;color:var(--ink)}button{cursor:pointer}button:hover{background:#edf3f4}button.active{background:#223d48;color:white;border-color:#223d48}input{min-width:230px;flex:1}main{padding:0 28px 28px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}h2{font-size:16px;margin:0}h3{font-size:14px}.canvas{overflow:auto;padding:14px}#overview{display:block;width:100%;min-width:740px;height:auto}svg text{font-family:'Yu Gothic','Meiryo',sans-serif;fill:#243f49}svg .tiny{font-size:11px;fill:#657980}svg .node{cursor:pointer}svg .node:hover rect{stroke-width:2.5}aside{padding:20px}aside p{font-size:13px}.legend{display:flex;gap:17px;padding:14px 20px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.note{padding:12px 20px;background:#f7f9fa;color:#566d77;font-size:12px;line-height:1.8}.record{border-top:1px solid var(--line);padding:13px 0}.record button{width:100%;text-align:left}.muted{color:var(--muted)}#searchpane{display:none}.searchlayout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}.results{height:630px;overflow:auto}.result{display:block;text-align:left;width:100%;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:13px 17px}.result strong{display:block;font-size:12px;overflow-wrap:anywhere}.result span{display:block;font-size:12px;margin-top:6px;color:#657782}.details{padding:22px;min-height:630px;overflow:auto}.equation{font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;padding:16px;border-radius:8px;line-height:1.8}dl{display:grid;grid-template-columns:100px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere}dt{color:#667d86}#reactionGraph{width:100%;min-width:550px}.provenance{display:none;margin-top:16px;padding:22px;overflow-wrap:anywhere}.source{font-family:monospace;font-size:11px;margin:8px 0}.chip{display:inline-block;margin:4px 4px 0 0;padding:5px 8px;border:1px solid #d4dfe2;border-radius:5px;font-size:12px}.footer{padding:16px 4px;font-size:12px;color:#637880}a{color:#315daf}@media(max-width:1050px){.layout{grid-template-columns:1fr}aside{max-height:450px;overflow:auto}.searchlayout{grid-template-columns:260px minmax(0,1fr)}}@media(max-width:700px){header{padding:18px}main{padding:0 12px}.toolbar{padding:12px}.searchlayout{grid-template-columns:1fr}.results{height:260px}.top{display:block}.badge{display:inline-block;margin-top:10px}}
</style>
<header><div class="eyebrow">CO-CULTIVATION / MODEL EXPLORER</div><div class="top"><div><h1>3種共培養 代謝アトラス</h1><p>ゴム分解から共有プール、菌体代謝、PHA蓄積まで。</p></div><span class="badge">静的モデル · フラックス未表示</span></div></header>
<div class="toolbar"><button id="mapTab" class="active">全体マップ</button><button id="searchTab">反応を調べる</button><button id="sourceTab">出典と読み方</button><span style="flex:1"></span><button id="export">全体図をSVG保存</button></div>
<main><section id="mappane" class="layout"><div class="panel"><div class="panelhead"><h2>共有培地を介したモデルの接続</h2><span class="muted" style="font-size:12px">プールや菌種をクリック</span></div><div class="canvas"><svg id="overview" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" role="img" aria-label="3種共培養モデル全体図"></svg></div><div class="legend"><span><i class="dot" style="background:var(--or)"></i>OR16</span><span><i class="dot" style="background:var(--ns)"></i>NS21</span><span><i class="dot" style="background:var(--pf)"></i>P. freudenreichii</span><span>実線矢印：反応方向（表示ごとの説明を参照）</span><span>破線：共有培地との接続（方向は詳細参照）</span></div><div class="note">全体図は経路の索引です。菌種間の受け渡しの実行、反応速度、共生の成立は示しません。細胞内ネットワークは「反応を調べる」で実データを参照できます。</div></div><aside class="panel" id="context"></aside></section>
<section id="searchpane"><div class="toolbar" style="padding:0 0 16px"><select id="species" aria-label="菌種"></select><input id="query" placeholder="反応ID・代謝物・名称・遺伝子で検索" aria-label="反応検索"><select id="kind" aria-label="反応の種類"><option value="all">全反応</option><option value="exchange">交換反応</option><option value="internal">内部反応</option></select><span id="count" class="muted"></span></div><div class="searchlayout"><div class="panel results" id="results"></div><div class="panel details" id="detail"><p>左の反応を選択してください。</p></div></div></section>
<section class="panel provenance" id="provenance"></section><div class="footer" id="footer"></div></main>
<script id="data" type="application/json">__MODEL_DATA__</script>
<script>
'use strict';const D=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const colors={OR16:'#148579',NS21:'#426cc0',Pf:'#af7136'};const names={OR16:'Actinoplanes sp. OR16',NS21:'Rhizobacter gummiphilus NS21',Pf:'P. freudenreichii'};
const pools=[['lac__L_e','L-乳酸'],['ppa_e','プロピオン酸'],['ac_e','酢酸'],['o2_e','酸素 O₂'],['nh4_e','アンモニウム'],['C30_oligo_e','C30オリゴマー'],['odtd_e','ODTD'],['b12_e','B12'],['glc__D_e','D-グルコース']];
function tab(which){$('mappane').style.display=which==='map'?'grid':'none';$('searchpane').style.display=which==='search'?'block':'none';$('provenance').style.display=which==='source'?'block':'none';['map','search','source'].forEach(t=>$(t+'Tab').classList.toggle('active',t===which));$('export').style.display=which==='map'?'block':'none'}
$('mapTab').onclick=()=>tab('map');$('searchTab').onclick=()=>{tab('search');renderResults()};$('sourceTab').onclick=()=>tab('source');
function box(x,y,w,h,label,sub,color,action){return `<g class="node" data-action="${esc(action)}" tabindex="0" role="button" aria-label="${esc(label)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="white" stroke="${color}"/><text x="${x+w/2}" y="${y+26}" text-anchor="middle" font-size="16" font-weight="600">${esc(label)}</text><text class="tiny" x="${x+w/2}" y="${y+45}" text-anchor="middle">${esc(sub)}</text></g>`}
function drawMap(){let s=`<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#66828c"/></marker></defs><rect width="1000" height="730" fill="#fff"/><text x="28" y="29" font-size="12" fill="#657980">01  細胞外ゴム分解（dFBAの動的モデル）</text>`;
 const line=(d,label,x,y)=>`<path d="${d}" fill="none" stroke="#66828c" stroke-width="2" marker-end="url(#arrow)"/><text class="tiny" x="${x}" y="${y}">${label}</text>`;
 s+=line('M238 105H392','Lcp / RoxB',270,94)+line('M580 105H764','RoxA',644,94)+line('M160 135V190H850V135','RoxAによる直接切断',398,181);
 s+=box(55,73,183,62,'天然ゴム','bulk rubber · C5換算','#66828c','rubber')+box(392,73,188,62,'C30オリゴマー','動的な中間体プール','#66828c','pool:C30_oligo_e')+box(764,73,180,62,'ODTD','C15生成物プール','#66828c','pool:odtd_e');
 s+=`<text class="tiny" x="29" y="218">切断にはO₂を消費。C30はモデル上の代表プール。係数・速度はコード由来で、酵素固有の実測値ではない。</text><rect x="25" y="255" width="950" height="168" rx="14" fill="#f2f6f7" stroke="#dbe5e7"/><text x="44" y="279" font-size="12">02  共有培地 · 交換境界を見る</text>`;
 pools.forEach(([id,label],i)=>{let x=44+(i%5)*185,y=294+Math.floor(i/5)*59;s+=`<g class="node" data-action="pool:${id}" tabindex="0" role="button" aria-label="${label}"><rect x="${x}" y="${y}" width="174" height="49" rx="7" fill="#fff" stroke="#cad8dd"/><text x="${x+12}" y="${y+21}" font-size="13">${label}</text><text class="tiny" x="${x+12}" y="${y+38}">${id}</text></g>`});
 s+=`<text x="28" y="460" font-size="12">03  菌種ごとの代謝ネットワーク · クリックして反応を検索</text>`;
 D.species.forEach((sp,i)=>{let x=25+i*322,c=colors[sp.short];s+=`<path d="M${x+151} 423V489" stroke="${c}" stroke-width="2" stroke-dasharray="5 5"/><rect x="${x}" y="488" width="307" height="209" rx="13" fill="${c}09" stroke="${c}"/>`;s+=box(x+13,501,281,64,sp.short,names[sp.short],c,'species:'+sp.short);s+=`<text x="${x+22}" y="591" font-size="13">${sp.reactions.length.toLocaleString()} 反応 / ${Object.keys(sp.metabolites).length.toLocaleString()} 代謝物</text><text x="${x+22}" y="615" class="tiny">${sp.short==='OR16'?'Lcp関連の動的切断経路':sp.short==='NS21'?'Rox関連の動的切断・PHB / PHV蓄積':'乳酸・プロピオン酸の交換を詳細で確認'}</text><text x="${x+22}" y="641" class="tiny">増殖・維持代謝：反応式を参照</text><text x="${x+22}" y="666" class="tiny">死滅・貯蔵再利用：生理モデル側の仮定</text>`});$('overview').innerHTML=s;
 $('overview').querySelectorAll('[data-action]').forEach(el=>{const act=()=>{let a=el.dataset.action;if(a.startsWith('pool:'))showPool(a.slice(5));else if(a.startsWith('species:')){ $('species').value=a.slice(8);$('query').value='';$('kind').value='all';tab('search');renderResults()}else $('context').innerHTML='<h2>細胞外のゴム切断</h2><p>実線はdFBAの物質変換を示します。SBML内に注釈反応があっても、動的切断と細胞内FBAへの二重計上を意味しません。</p><p>LcpはOR16、RoxA/RoxBはNS21のモデル上の経路です。酸素消費と切断速度の仮定を含みます。</p><p>RoxA/RoxBの異種発現は研究室で未成功。今後はクルード由来の見かけの酸素応答として検証します。</p><p class="muted">src/dfba_simulator.py: degrade_rubber<br>src/audited_dfba.py: 酸素連立計算</p>'};el.onclick=act;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act()}}});}
function showPool(id){let label=pools.find(p=>p[0]===id)?.[1]||id;let html=`<h2>${esc(label)}</h2><p class="muted">${esc(id)}</p><p>以下は読み込みモデルの交換上下限です。培養時にはDO・在庫・生理条件に応じて変わります。</p>`;for(const sp of D.species){let rs=sp.reactions.filter(r=>r.pool===id);html+=`<div class="record"><h3 style="color:${colors[sp.short]}">${esc(names[sp.short])}</h3>`;html+=rs.length?rs.map(r=>`<button data-sp="${sp.short}" data-r="${esc(r.id)}">${esc(r.id)}<br><small>${r.uptake?'取込可':'取込不可'} / ${r.secretion?'分泌可':'分泌不可'}<br>[${r.bounds.join(', ')}]</small></button>`).join(''):'<span class="muted">対応する交換反応なし</span>';html+='</div>'}if(id==='b12_e')html+='<p><strong>外部B12依存は未確立。</strong>経路や注釈の存在から必須の種間供給とは判断しません。</p>';if(D.medium&&id in D.medium)html+=`<p class="muted">参照設計の初期値：${D.medium[id]} mmol/L<br>この値は選択した設計に限定されます。</p>`;$('context').innerHTML=html;$('context').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ $('species').value=b.dataset.sp;$('query').value=b.dataset.r;$('kind').value='all';tab('search');renderResults();showReaction(b.dataset.sp,b.dataset.r)})}
$('species').innerHTML='<option value="all">全菌種</option>'+D.species.map(s=>`<option value="${s.short}">${esc(names[s.short])}</option>`).join('');
function renderResults(){let q=$('query').value.toLowerCase().trim(),sp=$('species').value,k=$('kind').value;let rs=[];for(const s of D.species){if(sp!=='all'&&s.short!==sp)continue;for(const r of s.reactions){if(k==='exchange'&&!r.exchange||k==='internal'&&r.exchange)continue;if(q&&![r.id,r.name,r.equation,r.gpr,...Object.keys(r.stoich).map(m=>s.metabolites[m].name)].join(' ').toLowerCase().includes(q))continue;rs.push([s,r])}}$('count').textContent=rs.length.toLocaleString()+' 件';$('results').innerHTML=rs.slice(0,150).map(([s,r])=>`<button class="result" data-sp="${s.short}" data-id="${esc(r.id)}"><strong style="color:${colors[s.short]}">${s.short} · ${esc(r.id)}</strong><span>${esc(r.name||r.equation)}</span></button>`).join('')+(rs.length>150?'<p class="note">先頭150件を表示。検索で絞り込んでください。</p>':'');$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>showReaction(b.dataset.sp,b.dataset.id));if(!rs.length)$('results').innerHTML='<p class="note">一致する反応がありません。</p>'}
function showReaction(short,id){let s=D.species.find(s=>s.short===short),r=s.reactions.find(r=>r.id===id);const subs=Object.entries(r.stoich).filter(x=>x[1]<0),prod=Object.entries(r.stoich).filter(x=>x[1]>0);let h=Math.max(subs.length,prod.length,1)*70+40;let svg=`<svg id="reactionGraph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 ${h}" role="img" aria-label="選択反応の基質と生成物"><defs><marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="${colors[short]}"/></marker></defs>`;for(const [items,x,left] of [[subs,10,true],[prod,550,false]])items.forEach(([mid,c],i)=>{let y=20+i*70;svg+=`<path d="M${left?250:430} ${left?y+25:h/2} L${left?370:550} ${left?h/2:y+25}" stroke="${colors[short]}" fill="none" marker-end="url(#ra)"/><rect x="${x}" y="${y}" width="240" height="50" rx="7" fill="#f1f5f7" stroke="#cfdbdf"/><text x="${x+10}" y="${y+20}" font-size="13">${esc(Math.abs(c)+' '+mid)}</text><text x="${x+10}" y="${y+38}" font-size="10">${esc((s.metabolites[mid].name||'').slice(0,36))}</text>`});svg+=`<circle cx="400" cy="${h/2}" r="29" fill="${colors[short]}"/><text x="400" y="${h/2+5}" text-anchor="middle" style="fill:white;font-size:14px">反応</text></svg>`;
$('detail').innerHTML=`<span class="badge" style="color:${colors[short]}">${esc(names[short])}</span><h2 style="margin:18px 0 7px">${esc(r.id)}</h2><p>${esc(r.name)}</p><div style="overflow:auto">${svg}</div><p class="muted">図は化学量論の正方向。逆方向の可否は上下限を参照してください。</p><div class="equation">${esc(r.equation)}</div><dl><dt>境界</dt><dd>${r.bounds.join(' ～ ')} mmol gDW⁻¹ h⁻¹（GEMの設定値）</dd><dt>分類</dt><dd>${r.exchange?'交換反応':'内部反応 / モデル内反応'}</dd><dt>GPR</dt><dd>${esc(r.gpr||'記載なし')}</dd><dt>サブシステム</dt><dd>${esc(r.subsystem||'記載なし')}</dd><dt>注釈</dt><dd>${esc(JSON.stringify(r.annotation))}</dd></dl><h3>代謝物の詳細</h3>${Object.keys(r.stoich).map(m=>`<div class="record"><strong>${esc(m)}</strong><p>${esc(s.metabolites[m].name)}<br>化学式 ${esc(s.metabolites[m].formula||'未注釈')} / 区画 ${esc(s.metabolites[m].compartment)}</p><button class="nearby" data-met="${esc(m)}">この代謝物を含む反応を検索</button></div>`).join('')}<p class="note">反応の存在は発現・活性・フラックスの実証ではありません。モデル固有の擬似反応も含みます。</p>`;$('detail').querySelectorAll('.nearby').forEach(b=>b.onclick=()=>{$('query').value=b.dataset.met;$('species').value=short;$('kind').value='all';renderResults()})}
$('query').oninput=renderResults;$('species').onchange=renderResults;$('kind').onchange=renderResults;
$('provenance').innerHTML='<h2>データの出典と読み方</h2><p>実モデルを読み込み、B12関連GPRの注釈整理を適用した静的ネットワークです。FBA最適化は行っていません。交換可能な境界は、実際にその物質を産生することや、特定条件で交換が起こることの証拠ではありません。</p><p>全体図は独自配置です。KEGG mapの転載・KEGGへの完全な対応づけではありません。代謝物名・反応名・注釈は元モデルの記載に従います。</p><p>RoxA/RoxBの異種宿主発現は研究室で未成功。クルードによる測定を予定しており、見かけの複合応答と酵素固有定数を区別します。B12依存も実証済みとして描いていません。</p><h3>動的モデルと静的GEM</h3><p>全体図のゴム切断はdFBAコード由来です。詳細画面のGEM境界は培養中の在庫・酸素・貯蔵制約を反映した値ではありません。増殖・維持・死滅・貯蔵再利用の生理パラメータも未校正の仮定を含みます。</p><h3>抽出元とSHA-256</h3>'+Object.entries(D.sources).map(([p,h])=>`<div class="source">${esc(p)}<br><span class="muted">${h}</span></div>`).join('')+'<h3>B12注釈整理の記録</h3><pre class="equation">'+esc(JSON.stringify(D.b12_audit,null,2))+'</pre>';
$('export').onclick=()=>{let clone=$('overview').cloneNode(true);clone.insertAdjacentHTML('afterbegin','<style>text{font-family:sans-serif;fill:#243f49}.tiny{font-size:11px;fill:#657980}</style>');let blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='three_species_metabolic_map.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('footer').textContent='抽出日時 '+D.generated+' / 全 '+D.species.reduce((a,s)=>a+s.reactions.length,0).toLocaleString()+' 反応 / ソース指紋は「出典と読み方」に記録';drawMap();showPool('ppa_e');renderResults();
</script></html>
